name: Comprehensive CI

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master, production ]

jobs:
  terraform-check:
    name: Terraform Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Check Canonical Formatting
        run: terraform -chdir=infra/terraform fmt -check

      - name: Initialize Local Backend Sandbox
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Run Schema Validation
        run: terraform -chdir=infra/terraform validate

      - name: Run Local Planning Sandbox
        run: terraform -chdir=infra/terraform plan -no-color

      - name: Run tfsec Static Application Security Testing
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infra/terraform
          fail_on_severity: HIGH

  lint-and-format:
    name: Code Quality Linting Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Web UI Code Quality Checks
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint
            npx prettier --check strict_prompt_builder.js
          fi

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Ruff Linter & Formatting Checks
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          python -m ruff check lemonade_router.py manage_infra.py chatbot_backend.py interactive_cli_chat.py
          python -m ruff format --check lemonade_router.py manage_infra.py chatbot_backend.py interactive_cli_chat.py

  python-tests:
    name: Python Automated Testing & Coverage Suite
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Runtime and Test Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Execute Pytest Suite with Coverage Enforcement
        run: pytest --maxfail=1 --disable-warnings --cov=. --cov-fail-under=50
